name: Run Tests

on: 
 pull_request:
  branches:
    - dev

jobs:
    test:
     runs-on: ubuntu-latest

     steps:
        - name: checkout code
          uses: actions/checkout@v3

        - name: setup java
          uses: actions/checkout@v3
          with:
            distribution: 'temurin'
            java-version: '17'
   
        - name: Run tests
          run: mvn tests